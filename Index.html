<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BGameZone</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1a1a2e;
      color: #ffffff;
    }

    header {
      text-align: center;
      background-color: #0f3460;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    header p {
      color: #ddd;
      font-size: 1.2rem;
    }

    .games {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      padding: 40px;
      gap: 30px;
    }

    .game {
      background-color: #16213e;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      width: 200px;
      transition: transform 0.2s;
    }

    .game:hover {
      transform: scale(1.05);
    }

    .game img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .game h2 {
      font-size: 1.2rem;
      margin: 10px 0;
    }

    .game a {
      text-decoration: none;
      color: #00adb5;
      font-weight: bold;
    }

    footer {
      background-color: #0f3460;
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 BGameZone 🎮</h1>
    <p>Play awesome games online — free and fun!</p>
  </header>

  <main class="games">
    <div class="game">
      <img src="https://via.placeholder.com/150" alt="https://youtube.com">
      <h2>Game One</h2>
      <a href="#">Play Now</a>
    </div>
    <div class="game">
      <img src="https://via.placeholder.com/150" alt="Game 2">
      <h2>Game Two</h2>
      <a href="#">Play Now</a>
    </div>
    <div class="game">
      <img src="https://via.placeholder.com/150" alt="Game 3">
      <h2>Game Three</h2>
      <a href="#">Play Now</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 BGameZone. All rights reserved.</p>
  </footer>
</body>
</html>
